<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Parse an Excel formula in the browser and see the syntax tree that ClosedXML.Parser builds." />
    <title>ClosedXML.Parser visualizer</title>
    <!-- The Pages workflow sets the base to the repository path, for example /ClosedXML.Parser/. -->
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
</head>

<body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
